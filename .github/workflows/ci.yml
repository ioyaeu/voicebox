name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  frontend-quality:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck app + web
        run: bun run typecheck

      - name: Build web smoke test
        run: bun run build:web

  backend-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      # CPU-only torch keeps the job lean (PyPI's default Linux torch wheel is
      # the multi-GB CUDA build). Install it before requirements.txt so pip's
      # resolver keeps the CPU build.
      - name: Install CPU-only PyTorch
        run: pip install torch torchaudio --index-url https://download.pytorch.org/whl/cpu

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          # Engines installed --no-deps in the release build; some test modules
          # import backend packages that touch them at import time.
          pip install --no-deps chatterbox-tts
          pip install --no-deps hume-tada
          pip install pytest pytest-asyncio

      # Fixture-less run: the RVC suites skip the two checkpoint-fixture tests
      # cleanly and everything else passes. No GPU, no models, no venv symlink
      # (the dual-OpenMP crash is macOS-only; this runner is Linux).
      - name: Run backend tests
        working-directory: backend
        run: python -m pytest tests -q
